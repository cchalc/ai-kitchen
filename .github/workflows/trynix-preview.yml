name: trynix preview

# "Nix in the browser" PR previews. On each PR, build the flake package,
# push its closure to a CORS-enabled binary cache (cachix), then have trynix
# comment a link that boots the build in an in-browser QEMU-wasm VM.
#
# Cache: the public `cchalc` cachix cache (name + publicKey filled in below).
# REMAINING SETUP (one-time, maintainer): add the repo secret CACHIX_AUTH_TOKEN
# (Settings → Secrets and variables → Actions) so the cache-push step can auth.
# Until that secret exists, the build runs but the cache push / preview won't.
#
# Using `pull_request` (not `pull_request_target`): safe — it does NOT expose
# secrets to forked-PR code. Trade-off: previews only run for same-repo branches,
# not PRs opened from forks. Switch to pull_request_target only if fork previews
# are needed AND you accept the fork-secret-exposure risk.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: cchalc
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build preview package
        run: nix build .#default

      # Pinned to the exact engine snapshot requested. Note: `@v1` is the moving
      # tag if you'd rather auto-receive updates.
      - name: trynix preview
        uses: fzakaria/trynix@engine-20260913-2056
        with:
          cache: https://cchalc.cachix.org
          publicKey: cchalc.cachix.org-1:MxnYrAifVzliEFz4akELBpF+RHcmsEHMAkvW4yibNMA=
          attrs: .#default
